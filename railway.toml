[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.selfplay"

[deploy]
startCommand = "python3 training/gen10/run_generation.py"
numReplicas = 4
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[variables]
SELFPLAY_GAMES = "10000"
SELFPLAY_DEPTH = "8"
LABEL_DEPTH = "20"
THREADS = "4"
OUTPUT_DIR = "/data"
