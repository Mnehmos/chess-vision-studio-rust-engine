[package]
name = "cvs-bitboard-core"
version = "0.0.0"
edition = "2021"
license = "MIT"
description = "CVS Rust engine core — bitboard movegen + perft + SEE + value eval + search. The active engine for Chess Vision Studio (MIT, public)."

[lib]
name = "cvs_bitboard_core"
path = "src/lib.rs"

[[bin]]
name = "perft"
path = "src/bin/perft.rs"

[[bin]]
name = "eval_parity"
path = "src/bin/eval_parity.rs"

[[bin]]
name = "search_bench"
path = "src/bin/search_bench.rs"

[[bin]]
name = "analyze"
path = "src/bin/analyze.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[[bin]]
name = "uci"
path = "src/bin/uci.rs"
