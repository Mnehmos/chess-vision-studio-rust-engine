[package]
name = "cvs-bitboard-core"
version = "0.0.0"
edition = "2021"
description = "CVS Rust engine core — bitboard movegen + perft + SEE + value eval. The active engine path for Chess Vision Studio; the TS/chess.js engine is legacy/reference-only."

[lib]
name = "cvs_bitboard_core"
path = "src/lib.rs"

[[bin]]
name = "perft"
path = "src/bin/perft.rs"

[[bin]]
name = "eval_parity"
path = "src/bin/eval_parity.rs"

[[bin]]
name = "search_bench"
path = "src/bin/search_bench.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
